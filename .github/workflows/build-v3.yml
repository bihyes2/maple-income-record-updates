name: Build Maple Income v3

on:
  push:
    branches: [main]
    paths:
      - builder/source-v3.tar.gz.b64
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode source
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String((Get-Content builder/source-v3.tar.gz.b64 -Raw).Trim())
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\source.tar.gz", $bytes)
          New-Item -ItemType Directory -Force app | Out-Null
          tar -xzf "$env:RUNNER_TEMP\source.tar.gz" -C app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $version = node -p "require('./app/package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate JavaScript
        working-directory: app
        run: |
          node --check main.js
          node --check preload.js
          node --check update-preload.js
          node --check renderer/hub.js

      - name: Build Windows installer
        working-directory: app
        run: npm run dist:win

      - name: Verify update files
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $required = @(
            "app/dist-v3/MapleIncomeRecord-Setup-$version.exe",
            "app/dist-v3/MapleIncomeRecord-Setup-$version.exe.blockmap",
            "app/dist-v3/latest.yml"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing build artifact: $file" }
          }
          Get-Content app/dist-v3/latest.yml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapleIncomeRecord-v${{ steps.meta.outputs.version }}
          path: |
            app/dist-v3/MapleIncomeRecord-Setup-${{ steps.meta.outputs.version }}.exe
            app/dist-v3/MapleIncomeRecord-Setup-${{ steps.meta.outputs.version }}.exe.blockmap
            app/dist-v3/latest.yml
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --yes --cleanup-tag
          }
          $files = @(
            "app/dist-v3/MapleIncomeRecord-Setup-$version.exe",
            "app/dist-v3/MapleIncomeRecord-Setup-$version.exe.blockmap",
            "app/dist-v3/latest.yml"
          )
          gh release create $tag $files --title "메이플 수익 기록 v$version" --notes "정식 설치형 자동 업데이트 릴리스입니다." --latest
